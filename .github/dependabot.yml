version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
      groups:
          github-actions:
              update-types: [minor, patch]

    - package-ecosystem: bundler
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          fastlane:
              update-types: [minor, patch]
