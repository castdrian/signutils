name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    signkit:
        runs-on: macos-26
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - name: Test SignKit
              working-directory: Packages/SignKit
              run: swift test

    app:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - name: Install XcodeGen
              run: brew install xcodegen
            - run: xcodegen generate
            - name: Build for macOS
              run: |
                  xcodebuild build -project SignUtils.xcodeproj -scheme SignUtils -destination 'platform=macOS' \
                    -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | xcbeautify
            - name: Run the UI tests on iPhone
              run: |
                  DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("^iPhone [0-9]+ Pro Max$"))] | last | .udid')
                  xcodebuild test -project SignUtils.xcodeproj -scheme SignUtils -destination "platform=iOS Simulator,id=$DEVICE" \
                    -derivedDataPath build/dd \
                    -only-testing:SignUtilsUITests/SignUtilsUITests/testOnboardingOffersKeyAndDemo \
                    -only-testing:SignUtilsUITests/SignUtilsUITests/testCreatesAndRevokesASigningBundle | xcbeautify
